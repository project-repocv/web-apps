version: '3.8'

services:
  # Infrastructure services
  postgres-eureka:
    image: postgres:15-alpine
    container_name: postgres-eureka
    environment:
      POSTGRES_DB: eureka_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5439:5432"
    volumes:
      - postgres_eureka_data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-customer:
    image: postgres:15-alpine
    container_name: postgres-customer
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-account:
    image: postgres:15-alpine
    container_name: postgres-account
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_account_data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-transaction:
    image: postgres:15-alpine
    container_name: postgres-transaction
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - postgres_transaction_data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - banking-network

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - banking-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - banking-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - banking-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - banking-network

  grafana:
    image: grafana/grafana-enterprise
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
      - prometheus
    networks:
      - banking-network

  # Microservices
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-eureka:5432/eureka_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    depends_on:
      - postgres-eureka
    networks:
      - banking-network

  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-customer:5432/customer_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - ENCRYPTION_KEY=mySuperSecretEncryptionKey1234567890123456789012345678901234567890
    depends_on:
      - eureka-server
      - postgres-customer
    networks:
      - banking-network

  account-service:
    build: ./account-service
    container_name: account-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-account:5432/account_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - ENCRYPTION_KEY=mySuperSecretEncryptionKey1234567890123456789012345678901234567890
    depends_on:
      - eureka-server
      - postgres-account
      - customer-service
    networks:
      - banking-network

  transaction-service:
    build: ./transaction-service
    container_name: transaction-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-transaction:5432/transaction_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    depends_on:
      - eureka-server
      - postgres-transaction
      - account-service
      - rabbitmq
    networks:
      - banking-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-auth:5432/auth_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=mySecretKeyForBankingApplicationThatShouldBeLongAndSecureAndRandomlyGeneratedForProductionUse
    depends_on:
      - eureka-server
      - postgres-auth
    networks:
      - banking-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://postgres-notification:5432/notification_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
    depends_on:
      - eureka-server
      - postgres-notification
      - rabbitmq
    networks:
      - banking-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=mySecretKeyForBankingApplicationThatShouldBeLongAndSecureAndRandomlyGeneratedForProductionUse
    depends_on:
      - eureka-server
      - redis
    networks:
      - banking-network

networks:
  banking-network:
    driver: bridge

volumes:
  postgres_eureka_data:
  postgres_customer_data:
  postgres_account_data:
  postgres_transaction_data:
  postgres_auth_data:
  postgres_notification_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
