server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: file://${CONFIG_REPO_PATH:/tmp/config-repo}
          default-label: main
          force-pull: true
          clone-on-start: false
        encrypt:
          enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.config: OFF
    com.netflix.discovery: OFF
